<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Producto</title>

    <style>
        {% include "productos/estilos.css" %}
    </style>
</head>

<body>

<h1>Producto</h1>

<form method="POST">

    {% csrf_token %}

    <p>
        <label>Nombre:</label><br>
        <input
            type="text"
            name="nombre"
            value="{{ producto.nombre|default:'' }}"
            required
        >
    </p>

    <p>
        <label>Categoría (número):</label><br>
        <input
            type="text"
            name="categoria"
            value="{{ producto.categoria|default:'' }}"
            required
        >
        <br>
        <a href="/categorias/lista_categorias/" target="_blank">Ver categorías</a>
    </p>

    <p>
        <label>Precio:</label><br>
        <input
            type="number"
            step="1"
            name="precio"
            value="{{ producto.precio|stringformat:'s' }}"
            required
        >
    </p>

    <p>
        <label>Cantidad:</label><br>
        <input
            type="number"
            name="cantidad"
            value="{{ producto.cantidad|default:'' }}"
            required
        >
    </p>

    <p>
        <label>Estado:</label><br>
        <select name="estado">
            <option value="True" {% if producto.estado or not producto %}selected{% endif %}>Activo</option>
            <option value="False" {% if producto and not producto.estado %}selected{% endif %}>Inactivo</option>
        </select>
    </p>

    <button type="submit">
        Guardar
    </button>

</form>

<br>

<a href="/productos/listado_productos/">
    Ver productos
</a>

</body>

</html>
