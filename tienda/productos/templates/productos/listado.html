<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Listado de productos</title>
</head>
<body>
    <h1>Sistema de productos</h1>
    <a href="/productos/nuevo/">Registrar producto</a>

    {% if productos %}
        <table border="1">
            <tr>
                <th>Producto</th>
                <th>Categoría</th>
                <th>Precio</th>
                <th>Cantidad</th>
            </tr>
            {% for producto in productos %}
                <tr>
                    <td>{{ producto.nombre }}</td>
                    <td>{{ producto.categoria }}</td>
                    <td>${{ producto.precio }}</td>
                    <td>{{ producto.cantidad }}</td>
                </tr>
            {% endfor %}
        </table>
    {% else %}
        <p>Todavía no hay productos registrados.</p>
    {% endif %}
</body>
</html>
